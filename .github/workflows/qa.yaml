# Reusable static analysis and unit tests (pnpm qa).
name: QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Frontend · type-check
            command: pnpm --filter frontend run type-check
          - name: Frontend · lint
            command: pnpm --filter frontend run lint
          - name: Backend · type-check
            command: pnpm --filter backend run type-check
          - name: Backend · lint
            command: pnpm --filter backend run lint
          - name: Frontend · unit tests
            command: pnpm --filter frontend run test
          - name: Backend · unit tests
            command: pnpm --filter backend run test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: ${{ matrix.command }}

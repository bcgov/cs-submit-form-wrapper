# Manual UAT Crunchy PostgreSQL deployment.
#
# This workflow manages only the UAT Crunchy cluster lifecycle. Normal UAT app
# UAT app deployments should consume the existing Crunchy-generated secrets and run
# application migrations separately.
name: Deploy Crunchy UAT

run-name: Deploy UAT Crunchy Postgres

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-crunchy-uat.yaml"
      - "deployments/helm/action-crunchy/values-uat.yml"

permissions:
  contents: read

concurrency:
  group: openshift-uat-crunchy
  cancel-in-progress: false

jobs:
  deploy-crunchy-uat:
    name: Deploy UAT Crunchy Postgres
    environment:
      name: uat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release: ${{ steps.crunchy.outputs.release }}
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Deploy Crunchy
        id: crunchy
        uses: bcgov/action-crunchy@7ee9c0bdec27f5251a8239373f51db1e01c7c4d9 # v2.1.0
        with:
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_server: ${{ vars.OC_SERVER }}
          values_file: deployments/helm/action-crunchy/values-uat.yml
          release_name: pg-soba-uat
          ref: v2.1.0

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Validate Crunchy resources
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          CLUSTER: ${{ steps.crunchy.outputs.cluster }}
        run: |
          set -euo pipefail

          EXPECTED_REPLICAS=3
          READY_REPLICAS="0"
          for attempt in $(seq 1 90); do
            READY_REPLICAS="$(oc -n "$NAMESPACE" get postgrescluster "$CLUSTER" -o jsonpath='{.status.instances[0].readyReplicas}' 2>/dev/null || true)"
            if [ "$READY_REPLICAS" = "$EXPECTED_REPLICAS" ]; then
              echo "Crunchy cluster ${CLUSTER} has ${EXPECTED_REPLICAS} ready Postgres replicas."
              break
            fi

            echo "Attempt ${attempt}: expected ${EXPECTED_REPLICAS} ready Postgres replicas for ${CLUSTER}, got ${READY_REPLICAS:-0}; waiting 10 seconds"
            sleep 10
          done

          if [ "$READY_REPLICAS" != "$EXPECTED_REPLICAS" ]; then
            echo "::error::Expected ${EXPECTED_REPLICAS} ready Postgres replicas for ${CLUSTER}, got ${READY_REPLICAS:-0}"
            oc -n "$NAMESPACE" get postgrescluster "$CLUSTER" -o yaml || true
            oc -n "$NAMESPACE" get pods -l "postgres-operator.crunchydata.com/cluster=${CLUSTER}" || true
            exit 1
          fi

          for secret in \
            "${CLUSTER}-pguser-appproxy" \
            "${CLUSTER}-pguser-admin" \
            "${CLUSTER}-pguser-app-reader" \
            "${CLUSTER}-pguser-temporal"; do
            for attempt in $(seq 1 30); do
              if oc -n "$NAMESPACE" get secret "$secret" >/dev/null 2>&1; then
                echo "Found expected secret ${secret}."
                break
              fi

              if [ "$attempt" = "30" ]; then
                echo "::error::Expected secret ${secret} was not created."
                exit 1
              fi

              echo "Attempt ${attempt}: expected secret ${secret} not found; waiting 10 seconds"
              sleep 10
            done
          done

          APPPROXY_SECRET="${CLUSTER}-pguser-appproxy"
          oc -n "$NAMESPACE" get secret "$APPPROXY_SECRET" -o jsonpath='{.data.uri}' >/dev/null
          oc -n "$NAMESPACE" get secret "$APPPROXY_SECRET" -o jsonpath="{.data['pgbouncer-uri']}" >/dev/null

      - name: Validate database connectivity
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          CLUSTER: ${{ steps.crunchy.outputs.cluster }}
        run: |
          set -euo pipefail

          PRIMARY_POD=""
          for attempt in $(seq 1 30); do
            PRIMARY_POD="$(oc -n "$NAMESPACE" get pod \
              -l "postgres-operator.crunchydata.com/cluster=${CLUSTER},postgres-operator.crunchydata.com/role=master" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -n "$PRIMARY_POD" ]; then
              echo "Found primary Postgres pod ${PRIMARY_POD}."
              break
            fi

            echo "Attempt ${attempt}: primary Postgres pod for ${CLUSTER} not found; waiting 10 seconds"
            sleep 10
          done

          if [ -z "$PRIMARY_POD" ]; then
            echo "::error::Could not find primary Postgres pod for ${CLUSTER}"
            oc -n "$NAMESPACE" get pods -l "postgres-operator.crunchydata.com/cluster=${CLUSTER}" || true
            exit 1
          fi

          run_psql_from_secret() {
            local secret_name="$1"
            local secret_jsonpath="$2"
            local sql="$3"
            local label="$4"

            for attempt in $(seq 1 30); do
              if oc -n "$NAMESPACE" get secret "$secret_name" -o "jsonpath=${secret_jsonpath}" \
                | base64 -d \
                | oc -n "$NAMESPACE" exec -i "$PRIMARY_POD" -c database -- \
                    sh -c 'read -r DATABASE_URI && psql "$DATABASE_URI" -v ON_ERROR_STOP=1 -c "$1"' sh "$sql"; then
                echo "Validated ${label}."
                return 0
              fi

              echo "Attempt ${attempt}: ${label} validation failed; waiting 10 seconds"
              sleep 10
            done

            echo "::error::${label} validation failed after retries."
            return 1
          }

          run_psql_from_secret "${CLUSTER}-pguser-appproxy" "{.data.uri}" \
            "SELECT current_database(), current_user;" \
            "appproxy direct Postgres connectivity"

          run_psql_from_secret "${CLUSTER}-pguser-appproxy" "{.data['pgbouncer-uri']}" \
            "SELECT current_database(), current_user;" \
            "appproxy PgBouncer connectivity"

          run_psql_from_secret "${CLUSTER}-pguser-temporal" "{.data.uri}" \
            "SELECT current_database(), current_user;" \
            "temporal direct Postgres connectivity"

          run_psql_from_secret "${CLUSTER}-pguser-appproxy" "{.data.uri}" \
            "SELECT datname FROM pg_database WHERE datname IN ('app', 'postgres', 'temporal', 'temporal_visibility') ORDER BY datname;" \
            "expected database list"

      - name: Deployment summary
        run: |
          {
            echo "## UAT Crunchy Postgres"
            echo ""
            echo "- Helm release: ${{ steps.crunchy.outputs.release }}"
            echo "- Crunchy cluster: ${{ steps.crunchy.outputs.cluster }}"
            echo "- Values file: deployments/helm/action-crunchy/values-uat.yml"
            echo ""
            echo "Expected pguser secrets:"
            echo ""
            echo "- ${{ steps.crunchy.outputs.cluster }}-pguser-appproxy"
            echo "- ${{ steps.crunchy.outputs.cluster }}-pguser-admin"
            echo "- ${{ steps.crunchy.outputs.cluster }}-pguser-app-reader"
            echo "- ${{ steps.crunchy.outputs.cluster }}-pguser-temporal"
          } >> "$GITHUB_STEP_SUMMARY"

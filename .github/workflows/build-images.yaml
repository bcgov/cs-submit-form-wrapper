# Build backend and frontend Docker images for GHCR.
# Reusable via workflow_call.
# Manual runs let devs choose amd64, arm64, or both (e.g. for local development/debugging).
# PRs and pushes to main default to amd64 only (OpenShift).
#
# Use in another workflow:
#
#   jobs:
#     set-vars:
#       outputs:
#         ref: refs/pull/${{ github.event.pull_request.number }}/head
#
#     build:
#       uses: ./.github/workflows/build-images.yaml
#       with:
#         ref: ${{ needs.set-vars.outputs.ref }}
#         platforms: amd64
#         image_version: pr-${{ github.event.pull_request.number }}  # e.g. pr-42 for PRs
#       secrets: inherit
#
#     deploy:
#       needs: [set-vars, build]
#       steps:
#         - run: |
#             TAG="sha-${{ needs.build.outputs.short_sha }}"
#             helm upgrade --install ... --set-string global.tag="${TAG}" ...
#
# Outputs: short_sha, image_version
name: Build Images

on:
  ##Deactivated.To be removed later as the actions are being handled by pipeline workflows currently
  # workflow_dispatch:
  #   inputs:
  #     ref:
  #       description: "Branch, PR number (e.g. 9), refs/pull/N/head, or SHA (blank = default branch)"
  #       required: false
  #     platforms:
  #       description: "Architectures to build"
  #       required: true
  #       default: amd64-arm64
  #       type: choice
  #       options:
  #         - amd64
  #         - arm64
  #         - amd64-arm64
  workflow_call:
    inputs:
      ref:
        description: "Ref to build (e.g. 9, refs/pull/9/head)"
        required: true
        type: string
      platforms:
        description: "amd64, arm64, or amd64-arm64"
        required: false
        default: amd64
        type: string
      image_version:
        description: "Primary image tag (e.g. pr-42, develop, or a release tag). Default derived from ref."
        required: false
        type: string
      publish_latest:
        description: "Also publish the image as the mutable latest tag."
        required: false
        default: false
        type: boolean
      base_path:
        description: "Next.js basePath for path-based routing (e.g. /pr-42)"
        required: false
        default: ""
        type: string
    outputs:
      short_sha:
        value: ${{ jobs.merge.outputs.short_sha }}
      image_version:
        value: ${{ jobs.merge.outputs.image_version }}
  # pull_request trigger disabled — PR builds now flow through pr_open.yaml → workflow_call
  # pull_request:
  #   types: [opened, synchronize, reopened]
  #   paths:
  #     - "backend/**"
  #     - "frontend/**"
  #     - ".github/workflows/build-images.yaml"
  #     - ".gitignore"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - "pnpm-workspace.yaml"
  ##Deactivated.To be removed later as the actions are being handled by pipeline workflows currently
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - "frontend/**"
  #     - ".github/workflows/build-images.yaml"
  #     - ".gitignore"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - "pnpm-workspace.yaml"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.vars.outputs.ref }}
      platforms: ${{ steps.vars.outputs.platforms }}
      image_version: ${{ steps.vars.outputs.image_version }}
      matrix: ${{ steps.vars.outputs.matrix }}
    steps:
      - name: Set variables
        id: vars
        run: |
          # A reusable workflow retains the caller's github.event_name (for
          # example, "push"), so select caller-provided inputs first instead
          # of testing for a non-existent "workflow_call" event here.
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
            PLATFORMS="${{ inputs.platforms }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
            PLATFORMS="${{ github.event.inputs.platforms }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="refs/pull/${{ github.event.pull_request.number }}/head"
            PLATFORMS="amd64"
          else
            REF="${{ github.sha }}"
            PLATFORMS="amd64"
          fi
          if [ -z "$REF" ]; then
            REF="${{ github.ref }}"
          fi
          # Normalize PR number to refs/pull/N/head for manual/call inputs
          if echo "$REF" | grep -qE '^[0-9]+$'; then
            REF="refs/pull/${REF}/head"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          # Build matrix based on requested platforms
          MATRIX='{"include":[]}'
          if echo "$PLATFORMS" | grep -q 'amd64'; then
            MATRIX=$(echo "$MATRIX" | jq -c '.include += [
              {"component":"backend","dockerfile_dir":"./backend","platform":"linux/amd64","platform_pair":"linux-amd64","runner":"ubuntu-24.04"},
              {"component":"frontend","dockerfile_dir":"./frontend","platform":"linux/amd64","platform_pair":"linux-amd64","runner":"ubuntu-24.04"},
              {"component":"temporal-worker","dockerfile_dir":"./backend","dockerfile":"Dockerfile.temporal-worker","platform":"linux/amd64","platform_pair":"linux-amd64","runner":"ubuntu-24.04"}
            ]')
          fi
          if echo "$PLATFORMS" | grep -q 'arm64'; then
            MATRIX=$(echo "$MATRIX" | jq -c '.include += [
              {"component":"backend","dockerfile_dir":"./backend","platform":"linux/arm64","platform_pair":"linux-arm64","runner":"ubuntu-24.04-arm"},
              {"component":"frontend","dockerfile_dir":"./frontend","platform":"linux/arm64","platform_pair":"linux-arm64","runner":"ubuntu-24.04-arm"},
              {"component":"temporal-worker","dockerfile_dir":"./backend","dockerfile":"Dockerfile.temporal-worker","platform":"linux/arm64","platform_pair":"linux-arm64","runner":"ubuntu-24.04-arm"}
            ]')
          fi
          # Use delimiter so JSON is not mangled by GITHUB_OUTPUT parsing
          echo "matrix<<MATRIX_EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "MATRIX_EOF" >> $GITHUB_OUTPUT
          # An explicit caller tag (including a release tag)
          if [ -n "${{ inputs.image_version }}" ]; then
            echo "image_version=${{ inputs.image_version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "$REF" | grep -q 'refs/pull/'; then
            PR_NUM=$(echo "$REF" | sed 's|refs/pull/||;s|/head||')
            echo "image_version=pr-${PR_NUM}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_version=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image_version=main" >> $GITHUB_OUTPUT
          else
            echo "image_version=local" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context = repo root (same as Makefile: docker build -f backend/Dockerfile .)
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile_dir }}/${{ matrix.dockerfile || 'Dockerfile' }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
          build-args: ${{ matrix.component == 'frontend' && inputs.base_path != '' && format('BASE_PATH={0}', inputs.base_path) || '' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "${{ runner.temp }}/digests/${{ matrix.component }}-${{ matrix.platform_pair }}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_version: ${{ needs.prepare.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set variables
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Merge backend
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          IMAGE_VERSION="${{ needs.prepare.outputs.image_version }}"
          DIGESTS=""
          for f in $(find digests -type f -name 'backend-*' 2>/dev/null); do
            DIGESTS="${DIGESTS} ${IMAGE}@$(cat $f)"
          done
          [ -n "$DIGESTS" ] || { echo "No backend digests"; exit 1; }
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=SOBA API backend for form data management" \
            -t ${IMAGE}:sha-${SHORT_SHA} -t ${IMAGE}:${IMAGE_VERSION} ${DIGESTS}
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=SOBA API backend for form data management" \
              -t ${IMAGE}:latest ${DIGESTS}
          fi

      - name: Merge frontend
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository }}/frontend"
          IMAGE_VERSION="${{ needs.prepare.outputs.image_version }}"
          DIGESTS=""
          for f in $(find digests -type f -name 'frontend-*' 2>/dev/null); do
            DIGESTS="${DIGESTS} ${IMAGE}@$(cat $f)"
          done
          [ -n "$DIGESTS" ] || { echo "No frontend digests"; exit 1; }
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=SOBA Next.js frontend for web form builder" \
            -t ${IMAGE}:sha-${SHORT_SHA} -t ${IMAGE}:${IMAGE_VERSION} ${DIGESTS}
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=SOBA Next.js frontend for web form builder" \
              -t ${IMAGE}:latest ${DIGESTS}
          fi

      - name: Merge temporal-worker
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository }}/temporal-worker"
          IMAGE_VERSION="${{ needs.prepare.outputs.image_version }}"
          DIGESTS=""
          for f in $(find digests -type f -name 'temporal-worker-*' 2>/dev/null); do
            DIGESTS="${DIGESTS} ${IMAGE}@$(cat $f)"
          done
          [ -n "$DIGESTS" ] || { echo "No temporal-worker digests"; exit 1; }
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=SOBA Temporal worker for workflow execution" \
            -t ${IMAGE}:sha-${SHORT_SHA} -t ${IMAGE}:${IMAGE_VERSION} ${DIGESTS}
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=SOBA Temporal worker for workflow execution" \
              -t ${IMAGE}:latest ${DIGESTS}
          fi

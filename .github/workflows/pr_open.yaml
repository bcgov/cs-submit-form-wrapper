# PR pipeline: QA (type-check, lint, unit tests), then build/deploy when app paths change.
# Also runnable manually (workflow_dispatch) with just a PR number (like CHEFS); a manual
# run force-deploys, bypassing the changed-paths gate.
name: PR Open
run-name: PR-${{ github.event.number || github.event.inputs.pr-number }}

env:
  ACRONYM: soba
  # PR deployments map to a fixed pool of slots (PR_NUM % SLOT_COUNT) so login
  # hostnames are a known, finite set. Sourced from the repo variable so
  # pr_close.yaml and the Keycloak redirect URIs (soba-N-designer / soba-N-forms,
  # N = 0 .. SLOT_COUNT-1) share one value; the literal is a fallback if unset.
  # value; the literal is a fallback if the variable is unset.
  SLOT_COUNT: ${{ vars.SLOT_COUNT || '20' }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
  # Manual trigger: build & deploy a specific PR on demand. Provide just the PR number
  # (e.g. 42). A manual run force-deploys, bypassing the changed-paths gate below.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.inputs.pr-number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/pr_open.yaml'
              - '.github/workflows/build-images.yaml'
              - '.github/workflows/qa.yaml'
              - '.gitignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deployments/**'

  qa:
    name: QA
    uses: ./.github/workflows/qa.yaml
    permissions:
      contents: read

  set-vars:
    name: Set variables
    runs-on: ubuntu-24.04
    needs: [qa, changes]
    if: ${{ needs.changes.outputs.deploy == 'true' && !startsWith(github.head_ref, 'release/') && github.head_ref != 'main' }}
    outputs:
      JOB_NAME: ${{ steps.vars.outputs.JOB_NAME }}
      URL: ${{ steps.vars.outputs.URL }}
      URL_FORMS: ${{ steps.vars.outputs.URL_FORMS }}
      ref: ${{ steps.vars.outputs.ref }}
      PR_NUM: ${{ steps.vars.outputs.PR_NUM }}
      SLOT: ${{ steps.vars.outputs.SLOT }}
    steps:
      - name: Setting variables
        id: vars
        run: |
          PR_NUMBER="${{ github.event.number || github.event.inputs.pr-number }}"
          PR_NUMBER="${PR_NUMBER//[^0-9]/}"
          SLOT=$(( PR_NUMBER % SLOT_COUNT ))
          echo "PR_NUM=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "SLOT=$SLOT" >> "$GITHUB_OUTPUT"
          echo "JOB_NAME=pr-slot-$SLOT" >> "$GITHUB_OUTPUT"
          echo "URL=https://soba-${SLOT}-designer.${{ vars.OC_DOMAIN }}" >> "$GITHUB_OUTPUT"
          echo "URL_FORMS=https://soba-${SLOT}-forms.${{ vars.OC_DOMAIN }}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/pull/$PR_NUMBER/head" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push
    uses: ./.github/workflows/build-images.yaml
    needs: [set-vars]
    with:
      ref: ${{ needs.set-vars.outputs.ref }}
      platforms: amd64
      image_version: pr-${{ needs.set-vars.outputs.PR_NUM }}
      #base_path: /pr-${{ needs.set-vars.outputs.PR_NUM }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-crunchy:
    name: Deploy Crunchy Postgres
    needs: [set-vars]
    runs-on: ubuntu-24.04
    outputs:
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Deploy Crunchy (add PR user)
        id: crunchy
        uses: bcgov/action-crunchy@7ee9c0bdec27f5251a8239373f51db1e01c7c4d9 # v2.1.0
        with:
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          values_file: deployments/helm/action-crunchy/values.yml
          release_name: pg-soba
          ref: v2.0.0

  deploy:
    name: Deploy SOBA
    needs: [set-vars, build, deploy-crunchy]
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr
      url: ${{ needs.set-vars.outputs.URL }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout repository from pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Deploy shared Temporal and ensure PR namespace
        uses: ./.github/actions/temporal-deploy
        with:
          namespace: ${{ secrets.OC_NAMESPACE }}
          temporal_namespace: soba-pr-${{ needs.set-vars.outputs.PR_NUM }}
          retention: "3d"
          chart_version: ${{ vars.TEMPORAL_CHART_VERSION || '0.74.0' }}

      - name: Get DB config from Crunchy secret
        id: db
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          CLUSTER: ${{ needs.deploy-crunchy.outputs.cluster }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
        run: |
          SECRET_NAME="${CLUSTER}-pguser-app-${PR_NUM}"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      # Pipeline performance fix: Revert if needed.
      - name: Wait for PR database readiness
        uses: ./.github/actions/wait-for-postgres
        with:
          secret_name: ${{ steps.db.outputs.secret_name }}
          namespace: ${{ secrets.OC_NAMESPACE }}
          label: PR database
      # Pipeline performance fix: Revert if needed.

      - name: Generate values override and deploy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          RELEASE: soba-${{ needs.set-vars.outputs.JOB_NAME }}
          TAG: sha-${{ needs.build.outputs.short_sha }}
          DOMAIN: ${{ vars.OC_DOMAIN }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
          SLOT: ${{ needs.set-vars.outputs.SLOT }}
        run: |
          # Pipeline performance fix: Revert if needed.
          set -euo pipefail
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          cat > /tmp/values-override.yaml <<OVERRIDE
          backend:
            image:
              repository: "ghcr.io/${REPO_LC}/backend"
              tag: "${TAG}"
          frontend:
            image:
              repository: "ghcr.io/${REPO_LC}/frontend"
              tag: "${TAG}"
            # Slot hosts are decoupled from the release name, so pin them per app.
            # Backend CORS_ORIGIN is derived from these two hosts by the chart.
            apps:
              designer:
                host: "soba-${SLOT}-designer.${DOMAIN}"
              forms:
                host: "soba-${SLOT}-forms.${DOMAIN}"
          temporalWorkersImage:
            repository: "ghcr.io/${REPO_LC}/temporal-worker"
            tag: "${TAG}"
            pullPolicy: IfNotPresent
          global:
            domain: "${DOMAIN}"
            prNumber: "${PR_NUM}"
          database:
            existingSecretName: "${{ steps.db.outputs.secret_name }}"
            existingSecretKey: "uri"
          temporal:
            address: "temporal-frontend.${NAMESPACE}.svc.cluster.local:7233"
            namespace: "soba-pr-${PR_NUM}"
          valkey:
            # PR-unique Redis namespace (by PR number, not the reused slot) so a recycled slot never
            # inherits a previous PR's cached rows, bus channels or streams on the shared Valkey.
            prefix: "soba-pr-${PR_NUM}:"

          OVERRIDE

          # Pipeline performance fix: Revert if needed.
          helm upgrade --install "${RELEASE}" ./deployments/helm/soba \
            --namespace "${NAMESPACE}" \
            --wait \
            --wait-for-jobs \
            --timeout 660s \
            -f deployments/helm/soba/values-pr.yaml \
            -f /tmp/values-override.yaml
          # Pipeline performance fix: Revert if needed.

          REVISION=$(helm status "${RELEASE}" -n "${NAMESPACE}" -o json | jq -r '.version')
          # Clean up old migration jobs and keep only current revision
          oc get jobs -n "${NAMESPACE}" -o name \
            | grep "${RELEASE}-migrate-" \
            | grep -v -- "-migrate-${REVISION}$" \
            | xargs -r oc delete -n "${NAMESPACE}" 2>/dev/null || true

          for rollout in \
            "deployment/${RELEASE}-backend:backend" \
            "deployment/${RELEASE}-frontend-designer:frontend" \
            "deployment/${RELEASE}-frontend-forms:frontend" \
            "deployment/${RELEASE}-formio:formio" \
            "deployment/${RELEASE}-temporal-worker" \
            "deployment/${RELEASE}-temporal-worker-document-generation" \
            "statefulset/${RELEASE}-mongodb:mongodb"; do
            resource="${rollout%%:*}"
            label="${rollout##*:}"
            echo "Waiting for ${label} rollout..."
            oc rollout status "${resource}" -n "${NAMESPACE}" --timeout=300s
          done

      # Pipeline performance fix: Revert if needed.
      # Temporarily disabled openshift diagnostics; uncomment to restore.
      # - name: Deployment diagnostics
      #   if: failure()
      #   uses: ./.github/actions/openshift-diagnostics
      #   with:
      #     release: soba-${{ needs.set-vars.outputs.JOB_NAME }}
      #     namespace: ${{ secrets.OC_NAMESPACE }}
      #     database_secret_name: ${{ steps.db.outputs.secret_name }}
      # Pipeline performance fix: Revert if needed.

      - name: Release Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: success()
        with:
          header: release
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          message: |
            Release ${{ github.sha }} deployed:
            - Designer (design-mode): <${{ needs.set-vars.outputs.URL }}>
            - Forms (submit-mode): <${{ needs.set-vars.outputs.URL_FORMS }}>
          number: ${{ needs.set-vars.outputs.PR_NUM }}

  Tests:
    name: Integration Tests
    needs: [deploy, set-vars]
    uses: ./.github/workflows/playwright.yaml
    with:
      DEP_ENV: ${{ github.event.number || github.event.inputs.pr-number }} #Passes PR number
      pr_branch: ${{ needs.set-vars.outputs.ref }} # Passes the PR branch
      BASE_URL: ${{ needs.set-vars.outputs.URL }}
    secrets:
      Username: ${{ secrets.keycloakUsername }}
      Password: ${{ secrets.keycloakPassword }}
      MFA_CODE: ${{ secrets.MFA_CODE }}

# Triggers when a PR is merged to the develop branch.
name: On Merge
run-name: Deploy to Dev

env:
  ACRONYM: soba

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/on-merge.yaml"
      - ".github/workflows/build-images.yaml"
      - ".gitignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/**"
      - "sonar-project.properties"

  workflow_dispatch:

permissions: {}

concurrency:
  group: openshift-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push
    uses: ./.github/workflows/build-images.yaml
    with:
      ref: develop
      platforms: amd64
      image_version: develop
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-crunchy:
    name: Deploy Crunchy Postgres
    runs-on: ubuntu-24.04
    outputs:
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy Crunchy
        id: crunchy
        uses: bcgov/action-crunchy@7ee9c0bdec27f5251a8239373f51db1e01c7c4d9 # v2.1.0
        with:
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          values_file: deployments/helm/action-crunchy/values.yml
          release_name: pg-soba
          ref: v2.0.0

  deploy:
    name: Deploy SOBA to Dev
    needs: [build, deploy-crunchy]
    permissions:
      contents: read
    environment:
      name: dev
      url: https://soba-dev-designer.${{ vars.OC_DOMAIN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Deploy shared Temporal and ensure dev namespace
        uses: ./.github/actions/temporal-deploy
        with:
          namespace: ${{ secrets.OC_NAMESPACE }}
          temporal_namespace: soba-dev
          retention: "7d"
          chart_version: ${{ vars.TEMPORAL_CHART_VERSION || '0.74.0' }}

      - name: Get DB config from Crunchy secret
        id: db
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          CLUSTER: ${{ needs.deploy-crunchy.outputs.cluster }}
        run: |
          SECRET_NAME="${CLUSTER}-pguser-app"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      # Pipeline performance fix: Revert if needed.
      - name: Wait for dev database readiness
        uses: ./.github/actions/wait-for-postgres
        with:
          secret_name: ${{ steps.db.outputs.secret_name }}
          namespace: ${{ secrets.OC_NAMESPACE }}
          label: dev database
      # Pipeline performance fix: Revert if needed.

      - name: Generate values override and deploy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          TAG: sha-${{ needs.build.outputs.short_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          DOMAIN: ${{ vars.OC_DOMAIN }}
        run: |
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # Version /meta reports, e.g. 2.0.0-beta.0+dev.a1b2c3d. Empty if unreadable: the
          # chart then omits APP_VERSION and the backend falls back to package.json.
          BASE_VERSION=$(jq -r '.version // empty' backend/package.json 2>/dev/null || echo "")
          APP_VERSION=""
          if [[ "$BASE_VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            APP_VERSION="${BASE_VERSION}+dev.${SHORT_SHA}"
          fi

          cat > /tmp/values-override.yaml <<OVERRIDE
          backend:
            image:
              repository: "ghcr.io/${REPO_LC}/backend"
              tag: "${TAG}"
            config:
              appVersion: "${APP_VERSION}"
              gitSha: "${SHORT_SHA}"
              gitTag: "${TAG}"
              imageTag: "${TAG}"
          frontend:
            image:
              repository: "ghcr.io/${REPO_LC}/frontend"
              tag: "${TAG}"
          temporalWorkersImage:
            repository: "ghcr.io/${REPO_LC}/temporal-worker"
            tag: "${TAG}"
            pullPolicy: IfNotPresent
          global:
            domain: "${DOMAIN}"
          database:
            existingSecretName: "${{ steps.db.outputs.secret_name }}"
            existingSecretKey: "uri"
          temporal:
            address: "temporal-frontend.${NAMESPACE}.svc.cluster.local:7233"
            namespace: "soba-dev"
          OVERRIDE

          # Pipeline performance fix: Revert if needed.
          helm upgrade --install "soba-dev" ./deployments/helm/soba \
            --namespace "${NAMESPACE}" \
            --wait \
            --wait-for-jobs \
            --timeout 660s \
            -f deployments/helm/soba/values-dev.yaml \
            -f /tmp/values-override.yaml
          # Pipeline performance fix: Revert if needed.

          REVISION=$(helm status "soba-dev" -n "${NAMESPACE}" -o json | jq -r '.version')
          # Clean up old migration jobs and keep only current revision
          oc get jobs -n "${NAMESPACE}" -o name \
            | grep "soba-dev-migrate-" \
            | grep -v -- "-migrate-${REVISION}$" \
            | xargs -r oc delete -n "${NAMESPACE}" 2>/dev/null || true

          echo "Waiting for backend rollout..."
          oc rollout status deployment/soba-dev-backend -n "${NAMESPACE}" --timeout=300s

          echo "Waiting for frontend rollouts (designer + forms)..."
          oc rollout status deployment/soba-dev-frontend-designer -n "${NAMESPACE}" --timeout=300s
          oc rollout status deployment/soba-dev-frontend-forms -n "${NAMESPACE}" --timeout=300s

          echo "Waiting for formio rollout..."
          oc rollout status deployment/soba-dev-formio -n "${NAMESPACE}" --timeout=300s

          echo "Waiting for mongodb rollout..."
          oc rollout status statefulset/soba-dev-mongodb -n "${NAMESPACE}" --timeout=300s

          echo "Waiting for temporal-worker rollouts..."
          oc rollout status deployment/soba-dev-temporal-worker -n "${NAMESPACE}" --timeout=300s
          oc rollout status deployment/soba-dev-temporal-worker-document-generation -n "${NAMESPACE}" --timeout=300s

      # Pipeline performance fix: Revert if needed.
      # Temporarily disabled openshift diagnostics; uncomment to restore.
      # - name: Deployment diagnostics
      #   if: failure()
      #   uses: ./.github/actions/openshift-diagnostics
      #   with:
      #     release: soba-dev
      #     namespace: ${{ secrets.OC_NAMESPACE }}
      #     database_secret_name: ${{ steps.db.outputs.secret_name }}
      # Pipeline performance fix: Revert if needed.

  Tests:
    name: Integration Tests
    needs: [deploy]
    uses: ./.github/workflows/playwright.yaml
    with:
      DEP_ENV: dev
      pr_branch: develop
    secrets:
      Username: ${{ secrets.keycloakUsername }}
      Password: ${{ secrets.keycloakPassword }}
      MFA_CODE: ${{ secrets.MFA_CODE }}

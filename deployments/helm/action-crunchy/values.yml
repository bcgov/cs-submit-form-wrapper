# Crunchy Postgres values for SOBA PR pipelines.
# Consumed by bcgov/action-crunchy; must be compatible with their chart (charts/crunchy).
# PR-specific user/database (app-<PR_NUMBER>) is added by the action at runtime.
global:
  config:
    dbName: app

crunchy:
  enabled: true
  postgresVersion: 18
  imagePullPolicy: IfNotPresent
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"
  clone:
    enabled: false
  restore:
    enabled: false
  instances:
    name: db
    replicas: 1
    # postgres_exporter is not supported for Postgres 18. Keep the scrape
    # annotations disabled with pgmonitor until OTel metrics are configured.
    # metadata:
    #   annotations:
    #     prometheus.io/scrape: 'true'
    #     prometheus.io/port: '9187'
    dataVolumeClaimSpec:
      # NOTE: PVCs can only grow, never shrink. The live pg-soba cluster (shared by dev +
      # all PR envs in this namespace) was provisioned at 5Gi pgdata / 512Mi wal, so any
      # value below the existing PVC size is rejected by the API ("can not be less than
      # previous value") and breaks on_merge. Keep these >= the live sizes; check with:
      #   oc get pvc -n <ns> -l postgres-operator.crunchydata.com/cluster=pg-soba-crunchy
      storage: 5Gi
      storageClassName: netapp-block-standard
      walStorage: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
    replicaCertCopy:
      requests:
        cpu: 1m
        memory: 32Mi
  # No backups for PRs — ephemeral environments; saves resources and storage.
  pgBackRest:
    enabled: false
    s3:
      enabled: false
  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 md5"
        - "host all all ::1/128 md5"
      parameters:
        shared_buffers: 16MB
        wal_buffers: "64kB"
        min_wal_size: 32MB
        max_wal_size: 64MB
        max_slot_wal_keep_size: 128MB
        work_mem: 2MB
        log_min_duration_statement: 1000ms
        effective_io_concurrency: 20
  proxy:
    enabled: true
    pgBouncer:
      replicas: 1
      requests:
        cpu: 5m
        memory: 32Mi
      maxConnections: 10
  pgmonitor:
    enabled: false
    exporter:
      requests:
        cpu: 10m
        memory: 32Mi
  users:
    - name: '{{ .Values.global.config.dbName }}'
      databases:
        - '{{ .Values.global.config.dbName }}'
      options: "SUPERUSER CREATEDB CREATEROLE"
    - name: 'postgres'
      databases:
        - 'postgres'
        - '{{ .Values.global.config.dbName }}'
    - name: '{{ .Values.global.config.dbName }}proxy'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: '{{ .Values.global.config.dbName }}proxytest'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: 'temporal'
      databases:
        - 'temporal'
        - 'temporal_visibility'
      options: "SUPERUSER CREATEDB CREATEROLE"

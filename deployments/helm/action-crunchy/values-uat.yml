# Crunchy Postgres values for SOBA UAT.
# Consumed by bcgov/action-crunchy; must be compatible with its charts/crunchy chart.
#
# UAT is intended to mirror the future production database pattern:
# - stable release/cluster name supplied by workflow: pg-soba-uat / pg-soba-uat-crunchy
# - explicit users and no fallback users
# - backend runtime connects through PgBouncer as appproxy
# - migrations use appproxy
# - Temporal connects directly as temporal
# - admin is the only exposed break-glass superuser
global:
  config:
    dbName: app

crunchy:
  enabled: true
  postgresVersion: 18
  openshift: true
  imagePullPolicy: IfNotPresent
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"
  clone:
    enabled: false
    s3:
      enabled: false
    pvc:
      enabled: false
    path: ~
  restore:
    repoName: ~
    enabled: false
    target: ~
  instances:
    name: db
    replicas: 3
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9187'
    dataVolumeClaimSpec:
      storage: 20Gi
      storageClassName: netapp-block-standard
      walStorage: 2Gi
    requests:
      cpu: 150m
      memory: 1536Mi
    replicaCertCopy:
      requests:
        cpu: 10m
        memory: 128Mi
  pgBackRest:
    enabled: false
    s3:
      enabled: false
  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 scram-sha-256"
        - "host all all ::1/128 scram-sha-256"
      parameters:
        shared_buffers: 512MB
        wal_buffers: "-1"
        min_wal_size: 128MB
        max_wal_size: 512MB
        max_slot_wal_keep_size: 1GB
        work_mem: 32MB
        log_min_duration_statement: 1000ms
        effective_io_concurrency: 20
  proxy:
    enabled: true
    pgBouncer:
      replicas: 2
      requests:
        cpu: 50m
        memory: 128Mi
      maxConnections: 100
      poolMode: transaction
  pgmonitor:
    enabled: false
    exporter:
      requests:
        cpu: 25m
        memory: 64Mi
  users:
    - name: 'appproxy'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: 'admin'
      databases:
        - 'postgres'
        - '{{ .Values.global.config.dbName }}'
      options: "SUPERUSER CREATEDB CREATEROLE"
    - name: 'app-reader'
      databases:
        - '{{ .Values.global.config.dbName }}'
    - name: 'temporal'
      databases:
        - 'temporal'
        - 'temporal_visibility'

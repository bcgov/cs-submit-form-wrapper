global:
  domain: apps.gov.bc.ca
  namespace: ""
  # Set true to remove "keep" policy on Secrets/PVCs (e.g. PR teardown)
  forceCleanup: false
  routeHost: ""
  routePath: ""
  # Owning PR number when a PR reuses a deployment slot; read on teardown so a
  # closing PR does not uninstall a newer PR that has since taken the slot.
  prNumber: ""

# -- Backend (Express API) ------------------------------------------------
backend:
  image:
    repository: ghcr.io/bcgov/soba/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    port: 4000
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    tls: false
    tlsSecretName: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # -- pre-install/pre-upgrade Job: runs drizzle migrate + seed
  migration:
    enabled: true
    activeDeadlineSeconds: 300

  # -- configmap-app: general application config
  config:
    logLevel: info
    nodeEnv: production
    # Allowed origin(s) for CORS (comma-separated). Defaults to frontend URL when unset.
    corsOrigin: ""
    # Base URL for this API (returned in /api/v1/meta/frontend-config). Defaults to backend public URL when unset.
    sobaApiBaseUrl: ""
    # Build meta (returned in /api/v1/meta/build). Set from CI (e.g. workflow override).
    gitSha: ""
    gitTag: ""
    imageTag: ""
    formEngineDefaultCode: formio-v5
    # Cache plugin. Default cache-memory (per-pod). Set cache-redis in a per-env values file
    # (values-<env>.yaml) once that namespace's Valkey chart is deployed and confirmed reachable —
    # cache-redis without a reachable Valkey is worse than cache-memory (no caching, warn per
    # reconnect). See the valkey block below for the shared-cache wiring.
    # Document generation backend code the consumer defaults to.
    documentGenerationDefaultCode: docgen-noop
    cacheDefaultCode: cache-memory
    messagebusDefaultCode: messagebus-memory
    eventStreamDefaultCode: eventstream-memory
    # Temp storage plugin. Default tempstorage-os stages temp bytes under
    # os.tmpdir() (per-pod, no PVC). Override to tempstorage-mount for a shared
    # RWX PVC across replicas (see the tempStorage block below).
    tempStorageDefaultCode: tempstorage-os
    # Virus scan plugin. Deployments scan for real against the shared clamav
    # (see the clamav block below); local dev overrides to virusscan-noop via .env.
    virusScanDefaultCode: virusscan-clamav
    sobaSystemSubject: soba-system

  # -- Shared temp storage PVC (RWX so it survives horizontal scaling).
  # Only provisioned/mounted when config.tempStorageDefaultCode is
  # tempstorage-mount; mountPath doubles as the plugin's DIR. Ignored otherwise.
  tempStorage:
    mountPath: /app/tmp
    accessMode: ReadWriteMany
    size: 1Gi
    storageClassName: ""

  # -- configmap-storage: files feature + storage profiles (STORAGE_* + FILES_*)
  storage:
    # Active storage profiles (comma-separated). Each needs a *Backend below.
    profiles: "default"
    # Backend for the 'default' profile. 'storage-memory' is in-process and ephemeral — no PVC,
    # no external service, lost on restart, per-replica. Fine for ephemeral (PR/dev) namespaces.
    # For durable, multi-replica environments override to 'storage-s3' and set the endpoint/
    # bucket below (credentials come from a Secret).
    defaultBackend: storage-memory
    # Profile the /files API reads/writes, and the max upload size it accepts (MB).
    filesStorageProfile: "default"
    filesMaxFileSizeMb: "10"

    # storage-local only: writable filesystem path for the default profile. Rendered only when set.
    defaultBasePath: ""

    # storage-s3 only — non-credential keys, rendered only when set. ACCESS_KEY/SECRET_KEY are
    # NOT here; supply them via a Secret. A full URL endpoint (https://host:port) also carries the
    # port and SSL flag, so defaultPort/defaultUseSsl can stay empty in that case.
    defaultEndpoint: ""
    defaultBucketName: ""
    defaultPort: ""
    defaultUseSsl: ""

  # -- configmap-formio: PLUGIN_FORMIO_V5_* (non-secret values)
  formio:
    routesAllowed: "true"
    proxyPath: /formio-v5
    # apiBaseUrl is auto-constructed from the formio service/external URL

  # -- configmap-document-generation: PLUGIN_CDOGS_* + default backend code
  documentGeneration:
    cdogsV2:
      endpoint: ""
      tokenUrl: ""
    cdogsV3:
      endpoint: ""

  # -- configmap-sso: IDP / SSO config
  sso:
    idpPluginDefaultCode: bcgov-sso
    idpPlugins: bcgov-sso
    jwksUri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349

  # -- configmap-ratelimit: RATE_LIMIT_*
  rateLimit:
    windowMs: "60000"
    max: "100"
    apiWindowMs: "60000"
    apiMax: "60"
    publicWindowMs: "60000"
    publicMax: "200"

# -- Frontend (Next.js) ---------------------------------------------------
frontend:
  image:
    repository: ghcr.io/bcgov/soba/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    port: 3000
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    tls: false
    tlsSecretName: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  # Optional: override SOBA_API_INTERNAL_URL (Next SSR → API). Default: in-cluster http://<release>-backend.<namespace>.svc.cluster.local:<port>/api/v1
  internalApiBaseUrl: ""
  # Comma-separated codes from GET /meta/features, or * / all for every platform-allowed feature. Empty = none.
  featuresAllowed: "*"

# -- Database (external Postgres) -----------------------------------------
database:
  # Option 1: full URI (takes precedence)
  uri: ""
  # Pipeline performance fix: Revert if needed.
  existingSecretName: ""
  existingSecretKey: "uri"
  # Pipeline performance fix: Revert if needed.
  # Option 2: components (used when uri is empty)
  host: ""
  port: "5432"
  user: postgres
  password: ""
  name: soba
  adminDatabase: postgres
  poolMax: "10"
  # Pipeline performance fix: Revert if needed.
  connectionTimeoutMs: "10000"
  queryTimeoutMs: "60000"
  statementTimeoutMs: "60000"
  lockTimeoutMs: "10000"
  migrationReadyAttempts: "5"
  migrationReadySleepMs: "5000"
  # Pipeline performance fix: Revert if needed.

# -- Form.io ---------------------------------------------------------------
formio:
  internal:
    enabled: true
  external:
    url: ""
  image:
    # Pull official images through Google's Docker Hub mirror to avoid the anonymous pull-rate
    # limit on the cluster (same image, matching digest).
    repository: mirror.gcr.io/formio/formio
    tag: 4.6.0
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  service:
    port: 3001
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  admin:
    email: formio@soba.gov.bc.ca
    password: ""
  jwtSecret: ""

# -- MongoDB (backing store for Form.io) -----------------------------------
mongodb:
  internal:
    enabled: true
  external:
    uri: ""
  image:
    # Google's Docker Hub mirror — avoids the anonymous pull-rate limit on the cluster (same
    # image, matching digest).
    repository: mirror.gcr.io/library/mongo
    tag: "7"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  service:
    port: 27017
  persistence:
    size: 1Gi
    storageClassName: ""

# -- ClamAV endpoint (alias to the separately-deployed clamav) ----------------
# ClamAV runs as its own chart (deployments/helm/clamav), one per namespace. The
# backend always targets an in-namespace ExternalName Service <release>-clamav on
# the URL <release>-clamav:port, so backend config never changes per env — only
# externalName (the real clamav Service) does. The alias Service + the backend
# wiring are created only when backend.config.virusScanDefaultCode == virusscan-clamav.
clamav:
  # Real clamav Service the <release>-clamav alias points at. Empty defaults to the
  # clamav Service in THIS namespace; override for cross-namespace (e.g. a PR in its
  # own namespace pointing at dev's clamav).
  externalName: ""
  port: 3310
  timeoutMs: "60000"

# -- Valkey endpoint (alias to the separately-deployed valkey) ----------------
# Valkey (Redis-compatible) runs as its own chart (deployments/helm/valkey), one per namespace,
# providing the shared cache, message bus and event streams (tune its persistence/eviction in the
# valkey chart per what it hosts). The backend always targets an in-namespace
# <release>-valkey alias Service on redis://<release>-valkey:port, so backend config never changes
# per env — only externalName does. The alias Service is created when either cacheDefaultCode ==
# cache-redis or messagebusDefaultCode == messagebus-redis; each plugin's PLUGIN_*_REDIS_* env is
# emitted only when that plugin is on redis.
valkey:
  # Real valkey Service the <release>-valkey alias points at. Empty defaults to the valkey Service
  # in THIS namespace; override for cross-namespace (e.g. a PR pointing at dev's valkey).
  externalName: ""
  port: 6379
  # Umbrella namespace for ALL Redis uses (cache keys, bus channels, streams) on a shared Valkey.
  # Empty = per-release prefix (<release>:). Set this to a caller-unique value (e.g. per PR number,
  # not the reused deploy slot) so short-lived releases that recycle names never collide. The
  # per-capability *Prefix values below override it when set.
  prefix: ""
  # Optional key namespace, so releases sharing a Valkey never collide on cache keys. Empty =
  # per-release prefix (<release>:), set by the backend configmap.
  keyPrefix: ""
  # Optional channel namespace, so releases sharing a Valkey never receive each other's bus events.
  # Empty = per-release prefix (<release>:), set by the backend configmap.
  channelPrefix: ""
  # Optional stream namespace, so releases sharing a Valkey never read each other's event streams or
  # share consumer groups. Empty = per-release prefix (<release>:), set by the backend configmap.
  streamPrefix: ""

# -- Temporal (shared server, env vars for backend + worker) ------------------
temporal:
  allowed: "false"
  address: ""
  namespace: "default"
  taskQueue: "soba"

# -- Temporal worker (dedicated image with glibc for @temporalio/core-bridge) --
temporalWorker:
  enabled: false
  image:
    repository: ghcr.io/bcgov/soba/temporal-worker
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Port for the worker's HTTP health endpoints (/readyz, /healthz)
  healthPort: 9090
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 512Mi

# -- Vault Agent Injector
vault:
  enabled: false
  role: ""
  authPath: auth/k8s-silver
  namespace: platform-services
  secretPath: ""
  serviceAccountName: ""

{{- $root := . }}
{{- if .Values.frontend.autoscaling.enabled }}
{{- range $name, $app := .Values.frontend.apps }}
{{- if ne $app.enabled false }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
  labels:
    {{- include "soba.labels" (dict "root" $root "component" (printf "frontend-%s" $name)) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
  minReplicas: {{ $root.Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}

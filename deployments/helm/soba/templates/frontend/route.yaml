{{- $root := . }}
{{- if .Values.frontend.route.enabled }}
{{- range $name, $app := .Values.frontend.apps }}
{{- if ne $app.enabled false }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
  labels:
    {{- include "soba.labels" (dict "root" $root "component" (printf "frontend-%s" $name)) | nindent 4 }}
spec:
  host: {{ include "soba.frontendHostFor" (dict "root" $root "name" $name "app" $app) }}
  {{- if $root.Values.global.routePath }}
  path: {{ $root.Values.global.routePath }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ $root.Values.frontend.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ $root.Values.frontend.route.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None
{{- end }}
{{- end }}
{{- end }}

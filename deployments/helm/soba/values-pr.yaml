# PR environment — minimal resources, single replica, internal Form.io + MongoDB
backend:
  replicas: 1
  config:
    documentGenerationDefaultCode: cdogs-v2
    # Ephemeral PR namespaces stage temp bytes under os.tmpdir() — no RWX PVC.
    tempStorageDefaultCode: tempstorage-os
    # Virus scan inherits virusscan-clamav from values.yaml: PRs deploy into the dev
    # namespace, so the <release>-clamav alias resolves to the shared dev clamav
    # (same namespace — no externalName override, no cross-namespace NSP needed).
    # Same for the cache and message bus: PRs share the dev-namespace Valkey via the <release>-valkey
    # alias; the per-release key/channel prefixes keep each PR's cached rows and bus events separate.
    cacheDefaultCode: cache-redis
    messagebusDefaultCode: messagebus-redis
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs-dev.api.gov.bc.ca/api
      tokenUrl: https://dev.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000
  sso:
    jwksUri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349
  migration:
    activeDeadlineSeconds: 600
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false

frontend:
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 25
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false

formio:
  internal:
    enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  # Formio depends on MongoDB; allow time for MongoDB to be ready after PR deploy
  readinessProbe:
    initialDelaySeconds: 45
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60

mongodb:
  internal:
    enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  persistence:
    size: 1Gi

temporal:
  allowed: "true"
  address: ""
  namespace: "default"
  taskQueue: "soba"

temporalWorkers:
  - name: temporal-worker
    enabled: true
    taskQueue: "soba"
    replicas: 1
    healthPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi

  - name: temporal-worker-document-generation
    enabled: true
    taskQueue: "document-generation"
    replicas: 1
    healthPort: 9091
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi

vault:
  enabled: true
  role: acf456-nonprod
  secretPath: acf456-nonprod/soba-dev
  serviceAccountName: acf456-vault
